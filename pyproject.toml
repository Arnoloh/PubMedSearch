[project]
name = "pubmed-csv"
# Single-sourced from pubmed_csv/version.py, which the update check also reads,
# so the packaged version and the reported version cannot drift apart.
dynamic = ["version"]
description = "Desktop app to search PubMed by keyword and export results to CSV"
requires-python = ">=3.11"
dependencies = [
    "pypubmed @ git+https://github.com/lescientifik/pypubmed.git",
    "defusedxml",  # used directly to re-read titles that contain inline markup
    "openpyxl",  # Excel (.xlsx) export
]

[project.scripts]
pubmed-csv = "pubmed_csv.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pubmed_csv"]

[tool.setuptools.dynamic]
version = { attr = "pubmed_csv.version.__version__" }
