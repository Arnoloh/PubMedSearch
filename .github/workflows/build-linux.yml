name: Build Linux binary

# PyInstaller cannot cross-compile, so the Linux binary is built on a Linux
# runner. Run it from the Actions tab (Run workflow), or just push to master.
# release.yml also calls this workflow, and publishes only once it succeeds.
on:
  push:
    branches: [master, main]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: linux-amd64
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Guards against GitHub quietly repointing the label at another CPU:
      # the artifact name promises amd64, so verify it.
      - name: Confirm the runner architecture
        run: |
          echo "runner reports: $(uname -m)"
          test "$(uname -m)" = "x86_64"

      # setup-python's Linux build needs the Tcl/Tk runtime beside it, or
      # PyInstaller bundles an app that dies on launch with no window.
      - name: Install the Tk runtime
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Check Tkinter works before building on it
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      # Must run before the install and the build, so the packaged app reports
      # the tag it was built from.
      - name: Stamp the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python stamp_version.py "$GITHUB_REF_NAME"

      - name: Install the app and its build tool
        run: pip install . pyinstaller

      - name: Build
        run: pyinstaller PubMedSearch.spec

      # The single-file binary, named for the platform it was built on.
      - name: Name the binary for this platform
        run: |
          test -f dist/PubMedSearch
          mv dist/PubMedSearch PubMedSearch-linux-amd64

      # archive: false uploads the file as-is, so downloading from the run page
      # gives the binary itself rather than a zip around it. It needs
      # upload-artifact v7+, and it takes the artifact name from the filename.
      - uses: actions/upload-artifact@v7
        with:
          path: PubMedSearch-linux-amd64
          archive: false
          if-no-files-found: error
