name: Publish release

# Runs the three build workflows, and publishes only if ALL of them succeed.
#
# They are called rather than duplicated here, because `needs:` cannot point at
# a job in another workflow file — calling them keeps one definition of each
# build while still gating the release on all three.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Cheap checks first, so a mistagged release fails in seconds rather than
  # after three builds.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The builds stamp the tag into pubmed_csv/version.py, so the tag has to
      # be something stamp_version.py accepts. Proving it here, on a throwaway
      # checkout, fails in seconds instead of once three builds are underway.
      - name: The tag must be a stampable version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python stamp_version.py "$GITHUB_REF_NAME"
          git --no-pager diff -- pubmed_csv/version.py

  windows:
    needs: verify
    uses: ./.github/workflows/build-windows.yml

  macos:
    needs: verify
    uses: ./.github/workflows/build-macos.yml

  linux:
    needs: verify
    uses: ./.github/workflows/build-linux.yml

  release:
    # A failure in any of the three builds stops the release.
    needs: [windows, macos, linux]
    # Dispatching from a branch still builds, but must never publish a release
    # named after that branch.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Every artifact from the builds above, each in its own subdirectory.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the builds
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          ls -lh release

      # The release promises three platforms, so refuse to publish a partial
      # set: an artifact quietly renamed upstream would otherwise ship a
      # release missing a platform.
      - name: Check all three builds are present
        run: |
          missing=""
          for expected in \
            "PubMedSearch.exe" \
            "PubMedSearch-macos-arm64.zip" \
            "PubMedSearch-linux-amd64.tar.gz"
          do
            test -f "release/$expected" || missing="$missing $expected"
          done
          if [ -n "$missing" ]; then
            echo "Missing from the build artifacts:$missing"
            exit 1
          fi

      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
