name: Build Windows executable

# PyInstaller cannot cross-compile, so the .exe is built on a Windows runner.
# Run it from the Actions tab (Run workflow), or just push to master.
# release.yml also calls this workflow, and publishes only once it succeeds.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Must run before the install and the build, so the packaged app reports
      # the tag it was built from.
      - name: Stamp the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          echo "GitHub ref: $GITHUB_REF"
          echo "GitHub ref name: $GITHUB_REF_NAME"
          python stamp_version.py "$GITHUB_REF_NAME"

      - name: Install the app and its build tool
        run: pip install . pyinstaller

      - name: Build PubMedSearch.exe
        run: pyinstaller PubMedSearch.spec

      - name: Check the executable was produced
        run: |
          if (-not (Test-Path dist/PubMedSearch.exe)) { throw "PubMedSearch.exe is missing" }
          Get-Item dist/PubMedSearch.exe | Select-Object Name, Length

      # archive: false uploads the file as-is, so downloading from the run page
      # gives PubMedSearch.exe itself rather than a zip around it. It needs
      # upload-artifact v7+, and it takes the artifact name from the filename.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/PubMedSearch.exe
          archive: false
          if-no-files-found: error
