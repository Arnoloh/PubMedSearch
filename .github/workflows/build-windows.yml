name: Build Windows executable

# PyInstaller cannot cross-compile, so the .exe is built on a Windows runner.
# Run it from the Actions tab (Run workflow), or just push to master.
# release.yml also calls this workflow, and publishes only once it succeeds.
on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Must run before the install and the build, so the packaged app reports
      # the tag it was built from.
      - name: Stamp the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python stamp_version.py "$GITHUB_REF_NAME"

      - name: Install the app and its build tool
        run: pip install . pyinstaller

      - name: Build PubMedSearch.exe
        run: pyinstaller PubMedSearch.spec

      - name: Check the executable was produced
        run: |
          if (-not (Test-Path dist/PubMedSearch.exe)) { throw "PubMedSearch.exe is missing" }
          Get-Item dist/PubMedSearch.exe | Select-Object Name, Length

      # Download this from the run's summary page once the job is green.
      - uses: actions/upload-artifact@v4
        with:
          name: PubMedSearch
          path: dist/PubMedSearch.exe
          if-no-files-found: error
