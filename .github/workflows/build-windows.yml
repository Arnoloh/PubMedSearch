name: Build Windows executable

# PyInstaller cannot cross-compile, so the .exe is built on a Windows runner.
# Run it from the Actions tab (Run workflow), or let a push to main trigger it.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # needed only by the tag-triggered release step

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the app and its build tool
        run: pip install . pyinstaller

      - name: Build PubMedSearch.exe
        run: pyinstaller PubMedSearch.spec

      - name: Check the executable was produced
        run: |
          if (-not (Test-Path dist/PubMedSearch.exe)) { throw "PubMedSearch.exe is missing" }
          Get-Item dist/PubMedSearch.exe | Select-Object Name, Length

      # Download this from the run's summary page once the job is green.
      - uses: actions/upload-artifact@v4
        with:
          name: PubMedSearch-windows
          path: dist/PubMedSearch.exe
          if-no-files-found: error

      # Pushing a tag such as v1.0.0 also publishes the exe as a release.
      - name: Attach the exe to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "${env:GITHUB_REF_NAME}" dist/PubMedSearch.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
